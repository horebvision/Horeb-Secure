# =============================================================================
# SECURIA — Configuration Locale Supabase CLI (Développement & Tests Isolés)
# Fichier : supabase/config.toml
# Compatible Supabase CLI v2.x (Docker local uniquement)
# STRICTEMENT LOCAL — AUCUN SECRET NI URL DE PRODUCTION DANS CE FICHIER
# =============================================================================

# Identifiant local unique du projet pour l'isolation des conteneurs
project_id = "securia"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[realtime]
enabled = true

[analytics]
enabled = false
